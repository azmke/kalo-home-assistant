name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Run Ruff
        run: ruff check .

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/kalo-release-venv
          /tmp/kalo-release-venv/bin/python -m pip install dist/*.whl
          /tmp/kalo-release-venv/bin/kalo --help
          /tmp/kalo-release-venv/bin/python -m kalo_api --help
